<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Thank you — DC Mobile Notary</title>
    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f8f9fa; color: #222; }
        .box { max-width: 460px; margin: 60px auto; background: #fff; border-radius: 12px; padding: 36px 28px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .stars { font-size: 36px; color: #f5b301; letter-spacing: 3px; margin: 8px 0 12px; }
        .stars .off { color: #ddd; }
        h1 { font-size: 22px; color: #003e9c; margin: 0 0 8px; }
        p { font-size: 15px; line-height: 1.6; color: #444; margin: 0 0 18px; }
        button { background: #003e9c; color: #fff; border: 0; border-radius: 8px; padding: 13px 28px; font-size: 16px; cursor: pointer; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #cfd8ea; border-top-color: #003e9c; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://cdn.prod.website-files.com/6432b1408e9cf5532f6bc77b/6433b649d57930296844cac0_dcmobilenotarylogo.png" alt="DC Mobile Notary" width="64">
        <div class="stars">{% for i in "12345" %}{% if forloop.counter <= stars %}&#9733;{% else %}<span class="off">&#9733;</span>{% endif %}{% endfor %}</div>
        <h1>Thank you{% if name %}, {{ name }}{% endif %}!</h1>
        <p id="msg"><span class="spinner"></span>Saving your rating&hellip;</p>
        <form id="f" method="post" action="">
            <noscript><button type="submit">Continue</button></noscript>
        </form>
    </div>
    <script>
        (function () {
            var f = document.getElementById('f');
            try { f.submit(); } catch (e) {}
            setTimeout(function () {
                document.getElementById('msg').innerHTML = 'Taking longer than expected. <br><br>';
                var b = document.createElement('button'); b.type = 'submit'; b.textContent = 'Continue';
                f.appendChild(b);
            }, 6000);
        })();
    </script>
</body>
</html>
