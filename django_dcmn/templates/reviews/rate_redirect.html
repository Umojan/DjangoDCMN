<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Thank you — DC Mobile Notary</title>
    <style>
        body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f3f6fb; color: #0f1f3d; }
        .wrap { max-width: 520px; margin: 0 auto; padding: 72px 20px; }
        .card { background: #fff; border-radius: 20px; padding: 44px 36px 40px; text-align: center; box-shadow: 0 10px 40px rgba(16,42,90,.08); }
        .logo { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
        .stars { font-size: 38px; line-height: 1; letter-spacing: 6px; color: #f5b301; margin: 0 0 18px; }
        .stars .off { color: #dfe4ec; }
        h1 { font-size: 26px; line-height: 1.2; font-weight: 700; margin: 0 0 10px; letter-spacing: -.01em; }
        p { font-size: 15px; line-height: 1.6; color: #4b5563; margin: 0 0 20px; }
        button { display: block; width: 100%; background: #003e9c; color: #fff; border: 0; border-radius: 12px; padding: 16px 24px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
        button:hover { background: #00327d; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #cfd8ea; border-top-color: #003e9c; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 479px) { .wrap { padding: 36px 16px; } .card { padding: 30px 22px 26px; border-radius: 16px; } h1 { font-size: 22px; } .stars { font-size: 32px; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <img class="logo" src="https://cdn.prod.website-files.com/6432b1408e9cf5532f6bc77b/6433b649d57930296844cac0_dcmobilenotarylogo.png" alt="DC Mobile Notary">
            <div class="stars">{% for i in "12345" %}{% if forloop.counter <= stars %}&#9733;{% else %}<span class="off">&#9733;</span>{% endif %}{% endfor %}</div>
            <h1>Thank you{% if name %}, {{ name }}{% endif %}!</h1>
            <p id="msg"><span class="spinner"></span>Saving your rating&hellip;</p>
            <form id="f" method="post" action="">
                <noscript><button type="submit">Continue</button></noscript>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var f = document.getElementById('f');
            try { f.submit(); } catch (e) {}
            setTimeout(function () {
                document.getElementById('msg').textContent = 'Taking longer than expected.';
                var b = document.createElement('button'); b.type = 'submit'; b.textContent = 'Continue';
                f.appendChild(b);
            }, 6000);
        })();
    </script>
</body>
</html>
